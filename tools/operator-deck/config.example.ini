; Estate Operator Deck example configuration
; Copy this file to config.ini in the same folder as OperatorDeck.ahk and adjust
; coordinates for the Steward's Windows monitor layout.
;
; Slot format: x,y,width,height
; Use Window Spy (installed with AutoHotkey) or PowerToys FancyZones to identify
; useful coordinates across a multi-monitor desktop. Negative x/y values are valid
; when a monitor is arranged to the left of or above the primary display.

[Settings]
DefaultWaitSeconds=10
PostLaunchDelayMs=500

[Slots]
; Calibrated 2026-07-21 from the Steward's four-monitor Windows layout.
; M1 = upper-left DISPLAY4, M2 = upper-right DISPLAY1
; M3 = lower-left primary DISPLAY3, M4 = lower-right DISPLAY2
; M3 uses the Windows work area and therefore excludes its 84-pixel bottom taskbar.
M1_TOP_LEFT=5,-2160,1920,1080
M1_TOP_RIGHT=1925,-2160,1920,1080
M1_BOTTOM_LEFT=5,-1080,1920,1080
M1_BOTTOM_RIGHT=1925,-1080,1920,1080
M2_TOP_LEFT=3845,-2154,1920,1080
M2_TOP_RIGHT=5765,-2154,1920,1080
M2_BOTTOM_LEFT=3845,-1074,1920,1080
M2_BOTTOM_RIGHT=5765,-1074,1920,1080
M3_TOP_LEFT=0,0,1920,1038
M3_TOP_RIGHT=1920,0,1920,1038
M3_BOTTOM_LEFT=0,1038,1920,1038
M3_BOTTOM_RIGHT=1920,1038,1920,1038
M4_TOP_LEFT=3845,6,1920,1080
M4_TOP_RIGHT=5765,6,1920,1080
M4_BOTTOM_LEFT=3845,1086,1920,1080
M4_BOTTOM_RIGHT=5765,1086,1920,1080

; Compatibility aliases used by the prototype targets below.
MAIN_WORK=0,0,1920,1038
PARK_1=1920,0,1920,1038
PARK_2=1920,1038,1920,1038
PARK_3=3845,6,1920,1080
PARK_4=5765,6,1920,1080

[Target:PowerShell]
match=ahk_exe pwsh.exe
launch=pwsh.exe
slot=MAIN_WORK
behavior=activate_or_launch

[Target:VSCode]
match=ahk_exe Code.exe
launch=code
slot=MAIN_WORK
behavior=activate_or_launch

[Target:GitHub]
match=GitHub ahk_exe chrome.exe
launch=https://github.com/
slot=PARK_2
behavior=activate_or_launch

[Target:ChatGPT-1]
; Adjust the title/app identifier to match the Chrome profile, PWA, or tab used on this workstation.
match=ChatGPT ahk_exe chrome.exe
launch=https://chatgpt.com/
slot=PARK_1
behavior=swap

[Target:ChatGPT-2]
; A second ChatGPT target usually needs a more specific title, Chrome app id, or profile-specific launch command.
match=ChatGPT ahk_exe chrome.exe
launch=
slot=PARK_2
behavior=swap

[Target:ComfyUI]
match=ComfyUI ahk_exe chrome.exe
launch=http://127.0.0.1:8188/
slot=PARK_3
behavior=activate_or_launch

[Target:Codex]
match=Codex ahk_exe WindowsTerminal.exe
launch=wt.exe
slot=PARK_4
behavior=activate_or_launch
