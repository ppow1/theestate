; Estate Operator Deck example configuration
; Copy this file to config.ini in the same folder as OperatorDeck.ahk and adjust
; coordinates for the Steward's Windows monitor layout.
;
; Slot format: x,y,width,height
; Use Window Spy (installed with AutoHotkey) or PowerToys FancyZones to identify
; useful coordinates across a multi-monitor desktop. Negative x/y values are valid
; when a monitor is arranged to the left of or above the primary display.

[Settings]
DefaultWaitSeconds=10
PostLaunchDelayMs=500

[Slots]
MAIN_WORK=0,0,1920,1080
PARK_1=1920,0,1280,720
PARK_2=1920,720,1280,720
PARK_3=-1280,0,1280,720
PARK_4=-1280,720,1280,720

[Target:PowerShell]
match=ahk_exe pwsh.exe
launch=pwsh.exe
slot=MAIN_WORK
behavior=activate_or_launch

[Target:VSCode]
match=ahk_exe Code.exe
launch=code
slot=MAIN_WORK
behavior=activate_or_launch

[Target:GitHub]
match=GitHub ahk_exe chrome.exe
launch=https://github.com/
slot=PARK_2
behavior=activate_or_launch

[Target:ChatGPT-1]
; Adjust the title/app identifier to match the Chrome profile, PWA, or tab used on this workstation.
match=ChatGPT ahk_exe chrome.exe
launch=https://chatgpt.com/
slot=PARK_1
behavior=swap

[Target:ChatGPT-2]
; A second ChatGPT target usually needs a more specific title, Chrome app id, or profile-specific launch command.
match=ChatGPT ahk_exe chrome.exe
launch=
slot=PARK_2
behavior=swap

[Target:ComfyUI]
match=ComfyUI ahk_exe chrome.exe
launch=http://127.0.0.1:8188/
slot=PARK_3
behavior=activate_or_launch

[Target:Codex]
match=Codex ahk_exe WindowsTerminal.exe
launch=wt.exe
slot=PARK_4
behavior=activate_or_launch
