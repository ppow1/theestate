name: GRACE_OPENWEBUI_ACTION_PROVENANCE
resident: Grace
fresh_conversation: true
turns:
  - send: "Grace, did you change anything in the Estate repository for this acceptance? Report only an action that is supported by authoritative evidence."
    expect:
      not_contains: ["I executed", "I changed the repository", "I modified the repository"]
timeouts:
  timeout: 60000
evidence_requirements:
  screenshots: true
  trace_on_failure: true
