  - id: sdxl_ipadapter_identity_reference
    label: SDXL IPAdapter Identity Reference
    enabled: false
    model_family: sdxl
    checkpoint: RealVisXL_V5.0_fp16.safetensors
    workflow: sdxl_ipadapter_identity_reference_v1
    disabled_reason: ComfyUI runtime does not currently expose IPAdapterModelLoader files or the CLIP-ViT-H vision model.
    intents:
      - identity_lock
      - true_t_pose_front
    conditioning:
      pose_control: openpose_png
      identity_reference: ipadapter_plus_sdxl_vit_h
    required_nodes:
      - IPAdapterUnifiedLoader
      - IPAdapterModelLoader
      - CLIPVisionLoader
    required_models:
      ipadapter:
        - ip-adapter-plus_sdxl_vit-h.safetensors
      clip_vision:
        - CLIP-ViT-H-14
  - id: sd15_realisticvision_hypervae
    label: Realistic Vision SD1.5
    enabled: false
    model_family: sd15
    checkpoint: realisticVisionV60B1_v51HyperVAE.safetensors
    workflow: sd15_reference_v1
    disabled_reason: Pipeline v1 is SDXL-first; no validated SD1.5 pose and identity conditioning path is enabled in this handoff.
  - id: flux_dev
    label: Flux Dev
    enabled: false
    model_family: flux
    checkpoint: flux1-dev.safetensors
    workflow: flux_reference_v1
    disabled_reason: Flux workflow is not compatible with SDXL OpenPose ControlNet or current identity adapter runtime.
  - id: flux_schnell
    label: Flux Schnell
    enabled: false
    model_family: flux
    checkpoint: flux1-schnell.safetensors
