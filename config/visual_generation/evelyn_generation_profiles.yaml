schema_version: evelyn_generation_profiles.v1
resident_id: evelyn
profile_set_id: evelyn_multimodel_tpose_pipeline_v1
default_endpoint: http://127.0.0.1:8188
campaign_defaults:
  bounded_front_tpose_candidates_per_profile: 1
  relaxed_candidates_per_angle: 4
  true_tpose_front_candidates_per_profile: 6
  true_tpose_turnaround_candidates_per_angle: 4
common_generation:
  width: 1024
  height: 1152
  steps: 30
  cfg: 5.5
  sampler_name: dpmpp_2m_sde
  scheduler: karras
  denoise: 1.0
  controlnet_strength: 0.48
  controlnet_start_percent: 0.0
  controlnet_end_percent: 0.92
  seed_base: 413014710
source_set:
  root: data/visual_bibles/residents/evelyn/internal/capture_360/version_1/originals
  manifest: Evelyn_V1_Source_Manifest.yaml
derived_output_root: data/visual_bibles/residents/evelyn/internal/capture_360/version_1/generated/evelyn_turnaround_v1
normalized_output_root: data/visual_bibles/residents/evelyn/internal/capture_360/version_1/derived/normalized
pose_asset_root: data/visual_bibles/residents/evelyn/internal/capture_360/version_1/derived/pose_controls
profiles:
  - id: sdxl_realvisxl_v5_pose_control_tpose
    label: RealVisXL V5 SDXL T-Pose Control
    enabled: true
    model_family: sdxl
    checkpoint: RealVisXL_V5.0_fp16.safetensors
    workflow: sdxl_pose_control_text_reference_v1
    intents:
      - true_t_pose_front
      - true_t_pose_turnaround
      - relaxed_turnaround
    conditioning:
      pose_control: tpose_silhouette_png
      identity_reference: normalized_source_triplet
      identity_adapter: unavailable_until_ipadapter_visible
    required_nodes:
      - CheckpointLoaderSimple
      - CLIPTextEncode
      - EmptyLatentImage
      - KSampler
      - VAEDecode
      - SaveImage
      - LoadImage
      - ControlNetLoader
      - ControlNetApplyAdvanced
    required_models:
      checkpoint:
        - RealVisXL_V5.0_fp16.safetensors
      controlnet:
        - diffusion_pytorch_model_promax.safetensors
  - id: sdxl_juggernaut_xi_pose_control_tpose
    label: Juggernaut XI SDXL T-Pose Control
    enabled: true
    model_family: sdxl
    checkpoint: Juggernaut-XI-byRunDiffusion.safetensors
    workflow: sdxl_pose_control_text_reference_v1
    intents:
