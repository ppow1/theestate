  - id: sdxl_cyberrealistic_v10_pose_control_tpose
    label: CyberRealistic XL V10 SDXL T-Pose Control
    enabled: true
    model_family: sdxl
    checkpoint: CyberRealisticXLPlay_V10.0_FP16.safetensors
    workflow: sdxl_pose_control_text_reference_v1
    intents:
      - true_t_pose_front
