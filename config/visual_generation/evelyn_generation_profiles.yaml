    label: DreamShaper XL Alpha2 SDXL T-Pose Control
    enabled: true
    model_family: sdxl
    checkpoint: DreamShaperXL1.0Alpha2_fixedVae_half_00001_.safetensors
    workflow: sdxl_pose_control_text_reference_v1
    intents:
      - true_t_pose_front
      - true_t_pose_turnaround
      - relaxed_turnaround
    conditioning:
      pose_control: tpose_silhouette_png
