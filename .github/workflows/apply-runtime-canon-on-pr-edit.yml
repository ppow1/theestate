name: Apply runtime canon patch on PR edit

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.number == 437 && github.event.pull_request.head.ref == 'agent/mhtml-runtime-canon-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mhtml-runtime-canon-recovery
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          git apply --check collaboration/recovery/mhtml_runtime_canon/0002-segment-runtime-canons.patch
          git apply collaboration/recovery/mhtml_runtime_canon/0002-segment-runtime-canons.patch

      - name: Run targeted tests
        run: python -m pytest -q tests/test_runtime_canon_recovery.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/estate/core/runtime_canon_recovery.py tests/test_runtime_canon_recovery.py
          git commit -m "fix: segment multiple runtime canons per assistant message"
          git push origin HEAD:agent/mhtml-runtime-canon-recovery
