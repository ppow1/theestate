name: Finalize canons
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-wp-4111-4112-canons
      - shell: pwsh
        run: collaboration/work_packages/recovered/reconstruct_runtime_canons.ps1
      - shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add collaboration/work_packages/recovered
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Reconstruct WP-4111 and WP-4112 runtime canons"
          git push
