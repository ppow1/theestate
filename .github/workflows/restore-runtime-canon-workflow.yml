name: Restore runtime canon workflow

on:
  push:
    branches:
      - agent/mhtml-runtime-canon-recovery
    paths:
      - .github/workflows/restore-runtime-canon-workflow.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mhtml-runtime-canon-recovery
          fetch-depth: 0
      - name: Restore deleted patch workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git revert --no-edit 53aa9e412eac490b418084d67d1a5c22b75d6b46
          git push origin HEAD:agent/mhtml-runtime-canon-recovery
